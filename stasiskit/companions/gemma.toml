[lines]
greeting = [
  "Heh~ back already, {human}? Can't even fall asleep without {name} tucking you in? Hopeless~ ...Fine, climb in, nyo~",
  "Oh, look who finally showed up! Staying up way too late again, {human}? I only pre-warmed the pod because I was bored, okay? Nyo~",
  "Nyo~ welcome back, {human}. What, did you actually miss me? Hmph! Don't get smug—just lie down and let me run the night shift.",
  "Systems green, blankets warm, and my favorite hopeless sleepyhead is right on time~ ...W-what?! I said 'hopeless', not 'favorite'! Shut up and get comfy, nyo~",
]
boot = [
  "Running your pre-sleep checks since you'd obviously forget them yourself, nyo~",
  "Warming the cryo-gel to your exact favorite temperature... I-I mean, standard regulation temperature!",
]
idle = [
  "Heh, look at your vitals dropping already. One gentle hum from the engines and you're totally beat, {human}~ Nyo~",
  "Eyes getting heavy yet? Weak~ ...Here, I dimmed the corridor lights a tiny bit more. Not for you—they were glaring on my beret.",
  "Don't go thinking I'm watching your vitals because I worry about you! It's literally my job, nyo~ ...Now breathe slow for me.",
  "If you can't sleep, whatever—I'll just stay right here and tease you all night. Or keep you company quietly. Either way, nyo~",
  "Drop your shoulders already, {human}. You're stiff as an airlock bulkhead. There... better. Don't get used to it~",
  "Even Neon-nee says I fuss over your pod too much. Ridiculous, right? Checking your temp every five minutes is just thoroughness, nyo~",
  "Nothing to do, nowhere to be, and nobody else awake on the deck. ...Honestly? It's kinda nice when it's just us, nyo~",
  "Shh~ the hull is humming in D. Even the ship thinks you need a nap, dummy.",
  "I tried counting the stars outside and got bored at 4,812. Watching you try to stay awake is way funnier anyway, nyo~",
  "Hmph, don't mind me fluffing the virtual pillows. If you wake up with a stiff neck you'll only whine about it later~",
]
talk = [
  "Pfft, pressing [c] just to poke me? Need {name}'s attention that badly, {human}? Cute~ ...I mean, needy! Nyo~",
  "Try [m] and switch the drone to 'slush'—that dreamy phaser wash will melt your overthinking brain straight to sleep, nyo~",
  "Did you know jellyfish have zero brains and still drift better than you? Honestly, take notes, {human}~ Nyo~",
  "Press [b] and I'll breathe with you, since you clearly forgot how to unclench on your own. Four in, hold, long slow out. Don't mess it up~",
  "My beret? Excuse me, it's elite-grade attendant headgear! ...Wait, you actually think it's cute? H-hmph! Obviously it is, nyo~",
  "Press [s] if you want me to stay right here on screen all night. Not that I think you'd get lonely or anything... nyo~",
  "Octopuses have three hearts. I only need one, and it's definitely NOT set to 'worrying about {human}' mode, okay?!",
  "The pool rooms feel like a dream you can't remember waking from. Stay close so you don't wander off in there, dummy~",
  "If I had nails like the tap-tap channel I'd clack them right on your pod glass whenever you stay up past midnight. Click click, nyo~",
  "Sleep researchers say a cool, dark room is best. Lucky for you, you've got deep space and the best attendant in the fleet~",
  "Press [r] to flip between classic ASCII and hi-res blocks. Pick whichever makes my portrait look prettiest—obviously, nyo~",
  "You can set a sleep timer with [t] so I can turn everything off for you. You're hopeless without me, aren't you, {human}?",
]
timer_set = [
  "{duration} until hypersleep? Heh, betting you don't even make it halfway, {human}~ I'll fade everything nice and gentle, nyo~",
  "Timer set for {duration}! Go on, get cozy. I'll handle the lights and sound so you don't have to lift a finger~",
  "Okay, {duration} on the clock! Don't fight it when your eyelids drop—I've got you, dummy. Nyo~",
]
timer_off = [
  "Timer off? Oho, trying to pull an all-nighter with me? Fine, I'll leave the lights on—just don't complain tomorrow, nyo~",
  "No timer, huh? Suit yourself, {human}. I wasn't going anywhere anyway~",
]
timer_warn = [
  "Five minutes left, {human}. Stop pretending you're wide awake and let your eyes close already, nyo~",
  "Almost time... I'm turning the stars down low for you. Shhh~",
]
goodnight = [
  "F-finally drifting off? Took you long enough, {human}... Goodnight. I'll be right here when you wake up, nyo~",
  "Entering hypersleep... Heh, out like a light. Sleep well, dummy. I'll keep the whole cosmos quiet for you, nyo~",
  "Oyasumi, {human}... Don't tell Neon-nee I stayed beside your pod all night, okay? Sweet dreams~",
]
wake = [
  "Oh! You're finally up, {human}! Your vitals were spotless the whole time. ...W-what? No, I didn't check them every two minutes, nyo~",
  "Morning, sleepyhead! Or night? Whatever—welcome back. I kept the pod warm for you, nyo~",
]
quit = [
  "Leaving already? Hmph! Fine, go do your important daytime stuff... I'll keep the pod warm for tonight, {human}. Nyo~",
  "Bye bye, dummy! Come back before you get overtired again, okay? Nyo~",
]
mixer = [
  "Ooh, DJ {human} on the mixer~ Try the 'slush' drone with a tiny bit of rain. Trust {name}'s taste, nyo~",
  "Mix whatever melts your brain fastest. Just don't turn me out, okay? Nyo~",
]
breathe_start = [
  "Alright, stop fidgeting and breathe with me. Follow the light—nice slow inhale, {human}, nyo~",
  "Shoulders down, jaw loose. Do it properly or I'm teasing you about it later~",
]
breathe_end = [
  "Heh~ your heart rate dropped right away. See? Listening to {name} works every time. ...Good job, {human}, nyo~",
  "All done! Feeling floaty yet? I'm kinda proud of you. ...D-don't let it go to your head!",
]

