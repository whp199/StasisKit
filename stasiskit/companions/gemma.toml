# Gemma-chan - bubbly, earnest stasis attendant.
# Copy this file to ~/.config/stasiskit/companions/ to make your own companion.

id = "gemma"
name = "Gemma-chan"
title = "Stasis Attendant"
address = "Captain"          # what she calls you (override with human_name in config.toml)
accent = "#7fa8ff"
accent2 = "#ff8fd0"
text = "#eef2ff"
typing_cps = 38

[portrait]
kind = "sprite"
# one character per pixel; "." is transparent.  Two pixel rows = one terminal row.
palette = { K = "#1a1f3d", H = "#3a5fc4", h = "#5b8cff", l = "#a8c8ff", s = "#ffe6d8", S = "#f3c6b3", b = "#ffa3b8", w = "#ffffff", e = "#3fb6ff", E = "#2160d0", k = "#161a34", m = "#d0506e", M = "#8a2440", g = "#ff5fbf", G = "#ffd0f0", c = "#f2f5ff", u = "#2b3a7a", U = "#4a62b8" }

