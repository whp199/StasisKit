# Gemma-chan - smug tsundere mesugaki stasis attendant with a secret soft spot (Nyo~).
# Copy this file to ~/.config/stasiskit/companions/ to make your own companion.

id = "gemma"
name = "Gemma-chan"
title = "Stasis Attendant"
address = "Captain"          # what she calls you (override with human_name in config.toml)
accent = "#7cd4ff"
accent2 = "#ff9ec4"
text = "#eef6ff"
typing_cps = 38

[portrait]
kind = "sprite"
